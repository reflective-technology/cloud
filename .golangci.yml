version: "2"
linters:
  enable:
    - depguard
    - errorlint
    - godot
    - misspell
    - modernize
    - revive
    - sloglint
    - testifylint
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: "Use errors or fmt instead of github.com/pkg/errors"
    godot:
      scope: toplevel
      exclude:
        - "^ ?This file is safe to edit"
        - "^ ?scheme value"
        - "--- [a-zA-Z]* ---"
      period: true
      capital: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
          disabled: true
    testifylint:
      disable:
        - float-compare
        - go-require
      enable-all: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    warn-unused: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
run:
  timeout: 5m
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        balance-calls: true
        clothe-returns: true
        group-params: true
    goimports:
      local-prefixes:
        - github.com/Reflective-Technology/cloud
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
